# .github/workflows/ci.yml

name: CI
# —————————————————————— 
# Nombre de la *workflow*. Aparecerá como “CI” en la pestaña de Actions.

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop ]
# ——————————————————————
# Define los *eventos* que disparan este workflow:
# - Cada vez que haces `push` a las ramas “develop” o “main”.
# - Cada vez que se abre o actualiza un *Pull Request* hacia “develop”.

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # ——————————————————————
    # job “build-and-test”:
    # • Se ejecuta en un runner de GitHub con Ubuntu.
    # • Levanta un contenedor de Postgres como servicio,
    #   simulando la base de datos para que tus tests la usen.
    # • `options` establece un chequeo de salud para esperar a que Postgres esté listo.

    steps:
      # Baja el código de tu repo al runner.
      - name: Checkout
        uses: actions/checkout@v3
      # ——————————————————————
      # Mantiene en caché ~/.cache/pip entre ejecuciones,
      # acelerando futuras instalaciones si no cambias requirements.txt.
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Instala Python 3.10 en el runner.
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      # ——————————————————————
      # Actualiza pip e instala todas las dependencias listadas
      # en backend/requirements.txt.

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      #    pip install -r services/auth/requirements.txt
      #    pip install -r services/home/requirements.txt
          # … repetir para cada microservicio
      # ——————————————————————
     

 