name: CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop ]

jobs:
  check-db:
    name: Validar Base de Datos
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: dw_user
          POSTGRES_PASSWORD: dw_pass
          POSTGRES_DB: dwellingwise
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U dw_user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Esperar a Postgres
        run: sleep 10  # o puedes añadir un loop *pg_isready*

      - name: Probar conexión con psql
        run: |
          docker run --rm --network host postgres:15 \
            psql postgresql://dw_user:dw_pass@localhost:5432/dwellingwise -c "SELECT 1;"
  
  backend:
    name: Validar Backend
    runs-on: ubuntu-latest
    needs: check-db
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: dw_user
          POSTGRES_PASSWORD: dw_pass
          POSTGRES_DB: dwellingwise
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U dw_user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with: 
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Arrancar FastAPI en background
        run: |
          cd backend
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5

      - name: Chequeo Health Endpoint
        run: |
          cd backend
          curl --fail http://localhost:8000/health

      - name: Probar Conexión ORM
        run: |
          cd backend
          python - <<EOF
          from sqlalchemy import create_engine
          engine = create_engine("postgresql://dw_user:dw_pass@localhost:5432/dwellingwise")
          print(engine.execute("SELECT 1;").fetchone())
          EOF

  frontend:
    name: Validar Frontend
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with: 
          node-version: '18'

      - name: Instalar dependencias
        run: |
          cd frontend
          npm ci

      - name: Construir la app
        run: |
          cd frontend
          npm run build

      - name: Server-side build smoke test
        run: |
          npx serve -s frontend/build -l 5000 & sleep 5
          curl --fail http://localhost:5000
